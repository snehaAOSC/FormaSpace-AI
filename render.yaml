services:
  - type: web
    name: formaspace-ai
    env: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: "*"
